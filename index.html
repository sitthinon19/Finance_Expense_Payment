<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Finance - Expense Payment</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7f9;font-family:Arial,"Noto Sans Thai",sans-serif;color:#222}.container{max-width:760px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 18px rgba(0,0,0,.07);margin-bottom:14px}h1{font-size:22px;margin:0 0 5px}.sub{color:#666;font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{border:1px solid #e4e8ec;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.loading{text-align:center;padding:30px;color:#666}.error{background:#fdecec;color:#b42318;padding:12px;border-radius:10px}.row{border:1px solid #e4e8ec;border-radius:14px;padding:14px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.small{font-size:12px;color:#777}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;border:1px solid #d9dee3}.pending{background:#fef3c7;color:#92400e;border-color:#fcd34d}.approved{background:#dcfce7;color:#166534;border-color:#86efac}.paid{background:#dbeafe;color:#1e40af;border-color:#93c5fd}button{border:0;border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eef1f4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:#fff;border-radius:18px;padding:18px;width:min(560px,100%)}input[type=file]{font:inherit}#proofPreview img{display:block;width:100%;max-height:280px;object-fit:contain;border:1px solid #e4e8ec;border-radius:12px;margin-top:6px}.proof-link{display:inline-block;margin-top:6px;font-size:12px}textarea{width:100%;min-height:80px;border:1px solid #d9dee3;border-radius:10px;padding:10px;font:inherit;margin-top:8px}@media(max-width:600px){.summary{grid-template-columns:1fr 1fr}.top{display:block}}
</style></head><body><div class="container"><div class="card"><h1>Finance · ค่าใช้จ่าย</h1><div id="user" class="sub">กำลังตรวจสอบสิทธิ์...</div><div class="summary"><div class="stat">รอ Finance<b id="pendingCount">-</b></div><div class="stat">รอจ่าย<b id="approvedCount">-</b></div><div class="stat">จ่ายแล้ว<b id="paidCount">-</b></div></div></div><div class="card"><div class="top"><div><b>รายการค่าใช้จ่าย</b><div class="small">Finance/Admin เท่านั้น</div></div><button class="secondary" id="refreshBtn">รีเฟรช</button></div><div id="list" class="loading">กำลังโหลด...</div></div></div>
<div id="modal" class="modal"><div class="sheet"><b id="modalTitle">บันทึกการจ่ายเงิน</b><div class="small" id="modalInfo" style="margin-top:5px"></div><label style="display:block;margin-top:12px">รูปหลักฐานการจ่ายเงินจากคลังรูปภาพ <span style="color:#c62828">*</span></label><input id="paymentProof" type="file" accept="image/*" style="width:100%;margin-top:8px"><div id="proofPreview" style="margin-top:10px"></div><label style="display:block;margin-top:12px">หมายเหตุ (ถ้ามี)</label><textarea id="remark" placeholder="เช่น โอนผ่านธนาคาร / เลขอ้างอิง"></textarea><div class="actions"><button class="secondary" id="cancelBtn">ยกเลิก</button><button class="primary" id="confirmBtn">ยืนยันจ่ายเงิน</button></div></div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const API_URL='https://script.google.com/macros/s/AKfycbyPOWRP2igYFFeRetDo50Nl6X8mdP-je3aBAn9G7v1RueCZW2NN_OkPBdwOdXCWVtibuw/exec';
const LIFF_ID='2011333828-CQ8zQlVa';
let idToken='',items=[],selectedId='';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(body){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,idToken})});return r.json();}
function render(){const pending=items.filter(x=>x.status==='Pending Finance').length, approved=items.filter(x=>x.status==='Approved'&&x.paymentStatus!=='Paid').length, paid=items.filter(x=>x.paymentStatus==='Paid').length;pendingCount.textContent=pending;approvedCount.textContent=approved;paidCount.textContent=paid;const box=list;if(!items.length){box.innerHTML='<div class="loading">ไม่มีรายการ</div>';return;}box.className='';box.innerHTML=items.map(x=>{let action='';if(x.status==='Pending Finance')action='<button class="primary" onclick="approveItem(\''+esc(x.expenseId)+'\')">อนุมัติรายการ</button>';if(x.status==='Approved'&&x.paymentStatus!=='Paid')action='<button class="primary" onclick="openPay(\''+esc(x.expenseId)+'\')">💸 บันทึกจ่ายเงิน</button>';return '<div class="row"><div class="top"><div><div class="name">'+esc(x.expenseId)+'</div><div class="small">'+esc(x.employeeName)+' · '+esc(x.department||'-')+'</div></div><div style="text-align:right"><b>'+Number(x.total||0).toLocaleString()+' บาท</b><div class="small">'+esc(x.date)+'</div></div></div><div style="margin-top:8px">'+esc(x.purpose||'-')+'</div><div style="margin-top:8px"><span class="badge '+(x.status==='Approved'?'approved':'pending')+'">'+(x.status==='Approved'?'อนุมัติแล้ว':'รอ Finance')+'</span> '+(x.paymentStatus==='Paid'?'<span class="badge paid">จ่ายแล้ว</span>':'<span class="badge pending">รอจ่ายเงิน</span>')+'</div>'+ (x.paymentProofUrl?'<div><a class="proof-link" href="'+esc(x.paymentProofUrl)+'" target="_blank" rel="noopener">📎 ดูหลักฐานการจ่ายเงิน</a></div>':'') +'<div class="actions">'+action+'</div></div>';}).join('');}
async function load(){list.className='loading';list.textContent='กำลังโหลด...';const r=await api({action:'getFinanceExpenseList'});if(!r.success){list.className='error';list.textContent=r.message||'ไม่มีสิทธิ์';return;}items=r.items||[];render();}
async function approveItem(id){if(!confirm('ยืนยันอนุมัติใบเบิก '+id+' ?'))return;const r=await api({action:'approveExpenseByFinance',expenseId:id});alert(r.message||'ดำเนินการแล้ว');if(r.success)load();}
function openPay(id){selectedId=id;const x=items.find(a=>a.expenseId===id);modalInfo.textContent=(x?.employeeName||'')+' · '+Number(x?.total||0).toLocaleString()+' บาท';remark.value='';paymentProof.value='';proofPreview.innerHTML='';modal.classList.add('show');}
function fileToBase64(file){return new Promise((resolve,reject)=>{if(!file)return reject(new Error('กรุณาแนบรูปหลักฐานการจ่ายเงิน'));if(file.size>8*1024*1024)return reject(new Error('รูปหลักฐานการจ่ายเงินต้องไม่เกิน 8 MB'));const rd=new FileReader();rd.onload=()=>resolve({base64:rd.result,name:file.name,mime:file.type||'image/jpeg'});rd.onerror=()=>reject(new Error('อ่านรูปหลักฐานไม่สำเร็จ'));rd.readAsDataURL(file);});}
async function pay(){if(!selectedId)return;confirmBtn.disabled=true;try{const f=await fileToBase64(paymentProof.files[0]);const r=await api({action:'markExpensePaid',expenseId:selectedId,remark:remark.value.trim(),paymentProofBase64:f.base64,paymentProofName:f.name,paymentProofMimeType:f.mime});alert(r.message||'ดำเนินการแล้ว');if(r.success){modal.classList.remove('show');load();}}catch(e){alert(e.message||'บันทึกการจ่ายเงินไม่สำเร็จ');}finally{confirmBtn.disabled=false;}}
cancelBtn.onclick=()=>modal.classList.remove('show');confirmBtn.onclick=pay;refreshBtn.onclick=load;paymentProof.onchange=()=>{const f=paymentProof.files[0];if(!f){proofPreview.innerHTML='';return;}if(f.size>8*1024*1024){proofPreview.innerHTML='<div class="error">ไฟล์ใหญ่เกิน 8 MB</div>';return;}const u=URL.createObjectURL(f);proofPreview.innerHTML='<img src="'+u+'" alt="หลักฐานการจ่ายเงิน"><div class="small">'+esc(f.name)+'</div>';};
async function init(){try{if(LIFF_ID==='PUT_FINANCE_LIFF_ID_HERE')throw new Error('กรุณาใส่ Finance LIFF ID ก่อนใช้งาน');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return;}idToken=liff.getIDToken();if(!idToken)throw new Error('ไม่พบ LINE ID Token');const p=liff.getDecodedIDToken?.();user.textContent=p?.name?('เข้าสู่ระบบ: '+p.name):'Finance / Admin';await load();}catch(e){user.textContent='';list.className='error';list.textContent=e.message||'เกิดข้อผิดพลาด';}}
window.addEventListener('load',init);
</script></body></html>
